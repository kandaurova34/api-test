[pytest]

testpaths = tests

addopts =
    -v
    --strict-markers
    -rspytest
    -ra

markers =
    smoke: критичные тесты, гонять после каждого деплоя
    regression: полный регрессионный набор
    slow: медленные тесты, гонять только в CI
    validators: тесты валидаторов
    auth: тесты регистрации и логина
    storage: тесты работы с хранилищем
    negative: Негативные сценарии (невалидные данные)